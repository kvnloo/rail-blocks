<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a21"><title>Rail Blocks • The magnetic railway</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<main id="desk">
  <canvas id="world" aria-label="Interactive three dimensional train table"></canvas>
  <header id="top"><div class="brand"><div class="mark" aria-hidden="true">▰<i></i></div><div><small>THE MAGNETIC RAILWAY</small><h1>Rail Blocks<span>3D</span></h1></div></div><button id="mute" aria-pressed="false" aria-label="Toggle sound">♪</button></header>
  <nav id="levels" aria-label="Railway challenges"></nav>
  <section id="mission" aria-live="polite"><div id="mission-label">CHALLENGE 01</div><h2 id="title"></h2><p id="brief"></p><div id="meta"></div></section>
  <div id="view-tools"><button id="orbit" aria-pressed="false" title="Orbit the camera">⤾ <span>Orbit</span></button><button id="view" title="Reset view" aria-label="Reset view">⌖</button></div>
  <footer id="dock"><div class="tray"><div class="tray-top"><span id="tray-label">PARTS TRAY</span><span id="tip">Drag a part or tap a blueprint</span></div><div id="parts"></div><div id="adjust" hidden><button id="lower" aria-label="Lower layer">↓</button><output id="layer"></output><button id="higher" aria-label="Raise layer">↑</button><button id="yaw">Turn</button><button id="pitch">Tilt</button><button id="roll">Roll</button><button id="erase" aria-pressed="false">Remove</button></div></div>
  <div class="run"><button id="reset" title="Clear the build" aria-label="Reset build">↺</button><button id="hint">Hint</button><button id="go"><span>▶</span> Run train</button></div></footer>
  <div role="status" id="toast"></div>
  <dialog id="result"><small id="result-tag"></small><h2 id="result-title"></h2><p id="result-copy"></p><form method="dialog"><button id="retry">Back to build</button><button id="next" value="next">Next track →</button></form></dialog>
</main>
<script type="module" src="main.mjs"></script>
</body></html>
